<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient: Deep Forest Obsidian -->
    <linearGradient id="coveBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141f19" />
      <stop offset="100%" stop-color="#0a0f0d" />
    </linearGradient>
    
    <!-- Gold / Amber Luxury Accent Gradient -->
    <linearGradient id="coveGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e0a9" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#9a7b20" />
    </linearGradient>

    <!-- Stream Cyan/Aqua Shimmer -->
    <linearGradient id="streamGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4fd1c5" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#81e6d9" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <!-- Base Icon Container (Smooth Squircle) -->
  <rect width="64" height="64" rx="14" fill="url(#coveBg)" />
  
  <!-- Subtle Outline Rim -->
  <rect width="62" height="62" x="1" y="1" rx="13" fill="none" stroke="url(#coveGold)" stroke-width="1.2" stroke-opacity="0.35" />

  <!-- Iconic A-Frame Villa Silhouette -->
  <!-- Outer A-Frame Triangular Roof Structure -->
  <polygon points="32,10 52,43 45,43 32,21 19,43 12,43" fill="url(#coveGold)" />
  
  <!-- A-Frame Crossbeam (Architectural Timber Truss) -->
  <rect x="23" y="32" width="18" height="2.5" rx="1" fill="url(#coveGold)" />
  
  <!-- Warm Glowing Attic Triangular Window -->
  <polygon points="32,17 40,30 24,30" fill="#fff7db" fill-opacity="0.95" />
  
  <!-- Gentle Attached Mountain Stream Waves at the Base -->
  <path d="M12,50 C18,47 24,53 32,50 C40,47 46,53 52,50" fill="none" stroke="url(#streamGlow)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M16,55 C22,53 27,57 34,55 C41,53 45,56 48,55" fill="none" stroke="url(#coveGold)" stroke-width="1.2" stroke-opacity="0.6" stroke-linecap="round" />
</svg>
